# Satani Configuration File
# Advanced configuration options for cybersecurity operations

[global]
# Framework version
version = 1.0
name = Satani Cybersecurity Framework
author = Security Research Team

[scanning]
# Network scanning configuration
enabled = true

# Default scan timeout (milliseconds)
port_scan_timeout = 500

# Maximum parallel connections
max_concurrent_connections = 50

# Port scanning configuration
port_scan_method = connect  # connect, syn, udp, fin
port_range = common  # common, all, custom

# ARP scanning
arp_enabled = true
arp_timeout = 1000

# DNS resolution
dns_enabled = true
dns_timeout = 2000

# Service detection
service_detection = enabled
http_detection = enabled
https_detection = enabled
ssh_detection = enabled
smb_detection = enabled

[detection]
# OS fingerprinting
os_detection = enabled
os_detection_method = port_analysis  # port_analysis, ttl_analysis, banner_grabbing

# Device type detection
device_type_detection = enabled
mac_oui_lookup = enabled

# Vulnerability assessment
vulnerability_scanning = enabled
cve_check = false  # Requires offline CVE database
default_creds_check = enabled

[exploitation]
# Exploitation framework settings
exploitation_enabled = true

# Vulnerability severity threshold
vulnerability_threshold = medium  # low, medium, high, critical

# Exploit modules to enable
ssh_bruteforce = false  # Disabled by default
smb_vulnerabilities = true
web_vulnerabilities = true
default_credentials = true

# Payload configuration
payload_encoding = xor  # xor, base64, none
payload_obfuscation = enabled

[control]
# Device control operations
control_enabled = true

# Shutdown/restart options
shutdown_timeout = 60  # seconds
restart_timeout = 60

# Lock operation timeout
lock_timeout = 5

# Wake-on-LAN
wol_enabled = true
wol_port = 9

[authentication]
# Remote access authentication
ssh_default_users = root,admin,user
ssh_default_passwords = password,admin,12345,root

# Windows authentication
winrm_enabled = true
smb_username = 
smb_password = 

[output]
# Output formatting options
output_format = table  # table, json, csv, xml
color_output = enabled
verbose_output = false

# Report generation
generate_report = false
report_format = html  # html, pdf, markdown
report_include_vulnerabilities = true
report_include_timeline = true

# Logging
log_file = satani.log
log_level = info  # debug, info, warning, error
log_scans = true
log_exploitation = true

[performance]
# Performance tuning
cache_enabled = true
cache_ttl = 300  # seconds

# Threading
enable_threading = true
thread_count = 4

# Memory
max_memory_usage = 512  # MB
buffer_size = 65536  # bytes

[security]
# Security settings
require_authorization_prompt = true
check_credentials_before_exploit = true
log_all_operations = true
require_sudo_for_network_ops = true

# Credential storage
store_credentials = false
encrypt_credentials = true

[network]
# Network configuration
default_subnet = 192.168.1.0/24
use_local_network = true
respect_gateway = true

# Timeout values (milliseconds)
connection_timeout = 5000
read_timeout = 3000
write_timeout = 3000

# Retry settings
max_retries = 3
retry_delay = 1000

[advanced]
# Advanced options
enable_raw_sockets = false
enable_packet_crafting = false
enable_traffic_sniffing = false

# Cross-network scanning
cross_network_enabled = false
cross_network_gateway = 

# Custom signatures
load_custom_signatures = false
signature_file = 

# Machine learning
ml_detection_enabled = false
ml_model_path = 

# Integration
metasploit_integration = false
metasploit_path = /usr/share/metasploit-framework

# Proxy settings
use_proxy = false
proxy_host = 
proxy_port = 8080

[filters]
# Network filtering
exclude_ips = 
exclude_subnets = 127.0.0.0/8
exclude_macs = 

include_ips = 
include_subnets = 
include_device_types = 

# Port filtering
exclude_ports = 
include_ports = 

# OS filtering
target_os = any  # Windows, Linux, MacOS, IoT, any

[compliance]
# Compliance and legal settings
require_written_authorization = true
log_authorization_proof = true
gdpr_compliant = true
ccpa_compliant = true

# Incident response
notify_administrator = false
administrator_email = 
report_incidents = true

# Data retention
data_retention_days = 30
anonymize_logs = false
